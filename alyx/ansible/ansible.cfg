# Config for the alyx deploy playbooks. Picked up automatically when ansible-playbook is
# run from this directory (ansible only reads an ansible.cfg from the CWD, so run these
# playbooks from here -- ANSIBLE_CONFIG=/path/to/this/ansible.cfg otherwise).
[defaults]
inventory = ./inventory.yaml
host_key_checking = True
interpreter_python = /usr/bin/python3
stdout_callback = yaml
# Long enough to survive an unresponsive host, short enough to fail the play rather than
# hang the whole rollout on one box.
timeout = 30

[ssh_connection]
# ControlPersist keeps one multiplexed connection per host for the whole run.
# ServerAliveInterval/CountMax guard against the deploy's genuinely long tasks (a cold
# `docker compose pull` can be silent for minutes) being killed as a dead connection:
# 30s * 40 = 20 minutes of silence tolerated before ssh gives up.
ssh_args = -o ControlMaster=auto -o ControlPersist=600s -o ServerAliveInterval=30 -o ServerAliveCountMax=40
pipelining = True
