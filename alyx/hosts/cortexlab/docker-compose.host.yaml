# Cortexlab overlay on top of the generic alyx base compose
# (cortex-lab/alyx deploy/app/docker-compose.yaml).
#
# Deployed via `ansible_deploy_alyx.yaml -e alyx_hostname=cortexlab`, which copies this
# file into ~/app and lists it in ~/app/.env's COMPOSE_FILE for a plain `docker compose up -d`.
#
# Differences from the base:
#   - installs django_ses (email via AWS SES) at startup;
#   - mounts the lab-specific settings_lab.py (kept sops-encrypted in the private
#     ibldevtools/config/alyx-cortexlab/; decrypt it to ALYX_SETTINGS_LAB on the host).
#
# `command` fully replaces the base command (compose does not merge it), so it repeats
# the base steps with the django_ses install prepended.
#
# RDS-backed, no local postgres used -- disabled below (profiles alone isn't enough,
# also needs !override on depends_on, see openalyx's overlay for why).
services:
  alyx_apache:
    command: >
      bash -c "uv pip install django_ses &&
               python /var/www/alyx/alyx/manage.py collectstatic --noinput &&
               /bin/bash /usr/local/bin/alyx_issue_ssl.sh &&
               chown www-data:www-data -fR /var/log/apache2 &&
               /usr/sbin/apache2ctl -DFOREGROUND"
    volumes:
      - ${ALYX_SETTINGS_LAB:-/home/ubuntu/settings_lab.py}:/var/www/alyx/alyx/alyx/settings_lab.py:ro
      # TRANSITIONAL -- remove once this host runs an alyx image newer than 3.6.4.
      #
      # The deployment scripts have moved to iblsre (synced to ~/app/scripts, mounted at /home/scripts
      # by docker-compose.scripts.yaml) and ec2_modify_groups.sh now ships inside the alyx
      # image at /usr/local/bin. Nothing in the new layout needs /home/iblalyx.
      #
      # It stays only because the image currently deployed here (3.6.4) has an
      # alyx_issue_ssl.sh that still hard-codes /home/iblalyx/crons/ec2_modify_groups.sh as
      # its certbot hook. That script runs on every container start and issues the
      # certificate when none exists, so removing the mount before the new image is deployed
      # would break certificate issuance on a rebuild.
      #
      # This is not hypothetical: the mount was dropped on 2026-08-29, certbot's 2026-09-01
      # renewal failed with "Unable to find pre-hook command
      # /home/iblalyx/crons/ec2_modify_groups.sh in the PATH", and the certificate lapsed on
      # 2026-09-13. Verify the deployed image ships /usr/local/bin/ec2_modify_groups.sh
      # before deleting this line.
      - ${IBLALYX_ROOT:-/home/ubuntu/iblalyx}:/home/iblalyx
    depends_on: !override []
  postgres:
    profiles: ["unused"]
